<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --primary: #4f46e5; --primary-dark: #4338ca; --border: #e2e8f0;
      --danger-bg: #fef2f2; --danger-text: #b91c1c; --danger-border: #fecaca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .subtitle { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
    label { display: block; margin-bottom: 14px; font-size: .85rem; font-weight: 600; }
    input {
      width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 8px; outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, .15); }
    button {
      width: 100%; padding: 11px; font-size: 1rem; font-weight: 600; color: #fff;
      background: var(--primary); border: 0; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    button.secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    button.secondary:hover { background: #eef2ff; }
    .error {
      margin-bottom: 14px; padding: 10px 12px; font-size: .9rem; border-radius: 8px;
      background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border);
    }
    .welcome { margin: 0 0 20px; font-size: 1rem; }
    .placeholder {
      margin-bottom: 20px; padding: 16px; border: 1px dashed var(--border);
      border-radius: 8px; color: var(--muted); font-size: .9rem; text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // sessionStorage pode falhar em alguns contextos; tudo funciona sem ele.
    function readToken() {
      try { return sessionStorage.getItem('token'); } catch (e) { return null; }
    }
    function writeToken(value) {
      try {
        if (value) sessionStorage.setItem('token', value);
        else sessionStorage.removeItem('token');
      } catch (e) { /* ignora */ }
    }

    function LoginForm({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      async function handleSubmit(event) {
        event.preventDefault();
        setError('');
        setLoading(true);
        try {
          const response = await fetch('/api/web/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (response.status === 401) {
            setError('Usuário ou senha inválidos.');
          } else if (!response.ok) {
            setError('Não foi possível entrar. Tente novamente.');
          } else {
            const data = await response.json();
            onLogin(data.token);
          }
        } catch (e) {
          setError('Não foi possível conectar ao servidor.');
        } finally {
          setLoading(false);
        }
      }

      return (
        <form onSubmit={handleSubmit}>
          <h1>To-Do List</h1>
          <p className="subtitle">Entre para continuar</p>
          {error && <div className="error" role="alert">{error}</div>}
          <label>
            Usuário
            <input
              type="text" value={username} autoComplete="username" required
              onChange={(e) => setUsername(e.target.value)}
            />
          </label>
          <label>
            Senha
            <input
              type="password" value={password} autoComplete="current-password" required
              onChange={(e) => setPassword(e.target.value)}
            />
          </label>
          <button type="submit" disabled={loading}>{loading ? 'Entrando...' : 'Entrar'}</button>
        </form>
      );
    }

    function Home({ username, onLogout }) {
      return (
        <div>
          <h1>To-Do List</h1>
          <p className="welcome">Olá, <strong>{username}</strong>! Você está logado.</p>
          <div className="placeholder">As tarefas aparecerão aqui nas próximas etapas do projeto.</div>
          <button className="secondary" onClick={onLogout}>Sair</button>
        </div>
      );
    }

    function App() {
      const [token, setToken] = useState(readToken());
      const [username, setUsername] = useState(null);

      function logout() {
        writeToken(null);
        setToken(null);
        setUsername(null);
      }

      function login(newToken) {
        writeToken(newToken);
        setToken(newToken);
      }

      // Valida o token na API sempre que ele muda (ex.: ao recarregar a página).
      useEffect(() => {
        if (!token) return;
        fetch('/api/web/me', { headers: { Authorization: 'Bearer ' + token } })
          .then((response) => (response.ok ? response.json() : Promise.reject()))
          .then((data) => setUsername(data.username))
          .catch(logout);
      }, [token]);

      return (
        <div className="card">
          {token && username
            ? <Home username={username} onLogout={logout} />
            : token
              ? <p className="subtitle">Carregando...</p>
              : <LoginForm onLogin={login} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
